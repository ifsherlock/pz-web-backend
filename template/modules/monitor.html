{{define "modules/monitor"}}
        <!-- Tab 3: Monitor -->
        <div x-show="currentTab === 'monitor'" class="p-4 space-y-6" x-transition:enter="transition ease-out duration-200">
            <!-- 按钮组 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                 <!-- 重启面板  -->
                <button class="btn h-auto min-h-28 flex-col gap-3 border-base-300 bg-base-200 py-4 text-base-content shadow-sm hover:border-primary/40 hover:bg-base-300" @click="restartPanel()">
                    <span class="flex h-10 w-10 items-center justify-center rounded-md bg-primary/10 text-primary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9" /></svg>
                    </span>
                    <span x-text="i18n.menu_restart_service"></span>
                </button>
                 <!-- 检查更新  -->
                <button class="btn h-auto min-h-28 flex-col gap-3 border-base-300 bg-base-200 py-4 text-base-content shadow-sm hover:border-secondary/40 hover:bg-base-300" @click="checkUpdate()">
                    <span class="flex h-10 w-10 items-center justify-center rounded-md bg-secondary/10 text-secondary">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                        </svg>
                    </span>
                    <span x-text="i18n.update_check"></span>
                </button>
                 <!-- 更新并重启  -->
                <button class="btn h-auto min-h-28 flex-col gap-3 border-base-300 bg-base-200 py-4 text-base-content shadow-sm hover:border-accent/40 hover:bg-base-300" @click="performAction('update_restart')">
                    <span class="flex h-10 w-10 items-center justify-center rounded-md bg-accent/10 text-accent">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75l3 3m0 0l3-3m-3 3v-7.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </span>
                    <span x-text="i18n.btn_update"></span>
                </button>
            </div>

            <div class="card bg-base-100 shadow-sm border border-base-200">
                <div class="card-body gap-4">
                    <div class="flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <h2 class="card-title text-base">存档备份</h2>
                            <p class="text-xs text-base-content/60">备份存档、服务器配置、数据库和 Workshop 元数据，不包含游戏程序。开关和参数修改后会自动保存。</p>
                        </div>
                        <label class="label cursor-pointer gap-2">
                            <span class="label-text">启用定时备份</span>
                            <input type="checkbox" class="toggle toggle-primary" x-model="backups.enabled" @change="scheduleBackupSettingsSave()" />
                        </label>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        <label class="form-control">
                            <span class="label-text text-xs">备份间隔（小时）</span>
                            <input type="number" min="1" max="168" class="input input-bordered input-sm" x-model.number="backups.interval_hours" @change="scheduleBackupSettingsSave()" />
                        </label>
                        <label class="form-control">
                            <span class="label-text text-xs">保留份数上限</span>
                            <input type="number" min="1" max="100" class="input input-bordered input-sm" x-model.number="backups.max_versions" @change="scheduleBackupSettingsSave()" />
                        </label>
                        <label class="form-control sm:col-span-2">
                            <span class="label-text text-xs">手动备份备注</span>
                            <input type="text" maxlength="200" class="input input-bordered input-sm" placeholder="例如：更新模组前" x-model="backupNote" />
                        </label>
                    </div>

                    <div class="flex flex-wrap gap-2">
                        <button class="btn btn-primary btn-sm" @click="createBackup()">立即备份</button>
                        <button class="btn btn-outline btn-sm" @click="saveBackupSettings()">立即保存设置</button>
                    </div>

                    <div class="divider my-1">游戏内自动备份参数</div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        <template x-for="item in backups.server_settings" :key="item.key">
                            <div class="rounded-md border border-base-200 p-3">
                                <div class="flex flex-col gap-1">
                                    <span class="badge badge-outline badge-sm font-mono w-fit config-key-label" :class="item.tooltip ? 'has-tooltip' : ''" @mouseenter="showConfigTooltip($event, item)" @mouseleave="hideConfigTooltip()" x-text="item.key"></span>
                                    <span class="text-sm" x-text="item.label"></span>
                                    <template x-if="item.options">
                                        <select class="select select-bordered select-sm" x-model="item.value" @change="scheduleBackupSettingsSave()"><template x-for="opt in item.options" :key="opt.value"><option :value="opt.value" x-text="opt.label"></option></template></select>
                                    </template>
                                    <template x-if="!item.options && (item.value === 'true' || item.value === 'false')">
                                        <select class="select select-bordered select-sm" x-model="item.value" @change="scheduleBackupSettingsSave()"><option value="true">是</option><option value="false">否</option></select>
                                    </template>
                                    <template x-if="!item.options && item.value !== 'true' && item.value !== 'false'">
                                        <input class="input input-bordered input-sm" type="text" x-model="item.value" @change="scheduleBackupSettingsSave()" />
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>

                    <div class="divider my-1">已保存备份</div>
                    <div class="overflow-x-auto">
                        <table class="table table-sm">
                            <thead><tr><th>时间</th><th>版本</th><th>备注</th><th>大小</th><th></th></tr></thead>
                            <tbody>
                                <template x-for="record in backups.backups" :key="record.id">
                                    <tr>
                                        <td x-text="formatBackupTime(record.created_at)"></td>
                                        <td x-text="record.game_version || '-'"></td>
                                        <td class="max-w-xs truncate" x-text="record.note || '-'"></td>
                                        <td x-text="formatBackupSize(record.size_bytes)"></td>
                                        <td class="text-right whitespace-nowrap"><button class="btn btn-xs btn-outline" @click="restoreBackup(record.id)">恢复</button> <button class="btn btn-xs btn-ghost" @click="deleteBackup(record.id)">删除</button></td>
                                    </tr>
                                </template>
                                <tr x-show="backups.backups.length === 0"><td colspan="5" class="text-center text-sm text-base-content/50">暂无备份</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 日志区域 -->
            <div class="card bg-base-100 shadow-xl border border-base-200">
                <div class="card-body p-0">
                    <!-- 标题栏 -->
                    <div class="p-3 border-b border-base-200 flex justify-between items-center bg-base-200/50 rounded-t-box">
                        <span class="font-bold text-sm flex items-center gap-2">
                            <!-- 状态指示灯 -->
                            <div class="w-2 h-2 rounded-full" 
                                :class="logConnected ? 'bg-green-500 animate-pulse' : 'bg-red-500'"></div>
                            Server Log (Real-time)
                        </span>
                        
                        <!-- 手动开关日志流 -->
                        <div class="flex gap-2">
                            <button class="btn btn-xs" @click="toggleLogStream()" x-text="i18n.btn_connect"></button>
                            <button class="btn btn-xs" @click="logs = ''">Clear</button>
                        </div>
                    </div>
                    
                    <!-- 日志内容框 -->
                    <!-- 
                        x-ref="logBox" 用于 JS 获取 DOM 元素进行自动滚动 
                        white-space-pre-wrap 保证换行正常显示
                    -->
                    <pre x-ref="logBox" class="h-[400px] overflow-auto p-4 text-xs font-mono bg-[#1e1e1e] text-green-500 leading-tight whitespace-pre-wrap" x-text="logs"></pre>
                </div>
            </div>
        </div>
{{end}}
