{{define "modules/server"}}
        <!-- Tab: Server -->
        <div x-show="currentTab === 'server'" class="p-4 md:p-0 space-y-4" x-transition:enter="transition ease-out duration-200">
            <!-- 仪表盘：CPU / 内存 / 运行时长 -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <!-- CPU -->
                <div class="card card-bordered bg-base-100 shadow-sm">
                    <div class="card-body p-4 flex flex-row items-center gap-3">
                        <div class="p-3 rounded-full bg-primary/10 text-primary shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
                        </div>
                        <div class="flex-1">
                            <div class="text-xs text-base-content/60" x-text="'CPU 使用率'"></div>
                            <div class="text-xl font-bold" x-text="(stats.cpu_percent || 0).toFixed(1) + '%'"></div>
                            <progress class="progress progress-primary w-full h-1.5 mt-1" :value="stats.cpu_percent || 0" max="100"></progress>
                        </div>
                    </div>
                </div>

                <!-- 内存 -->
                <div class="card card-bordered bg-base-100 shadow-sm">
                    <div class="card-body p-4 flex flex-row items-center gap-3">
                        <div class="p-3 rounded-full bg-secondary/10 text-secondary shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" /></svg>
                        </div>
                        <div class="flex-1">
                            <div class="text-xs text-base-content/60" x-text="'内存占用'"></div>
                            <div class="text-xl font-bold" x-text="formatGB(stats.mem_used_mb) + ' GB'"></div>
                            <progress class="progress progress-secondary w-full h-1.5 mt-1" :value="stats.mem_percent || 0" max="100"></progress>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-[10px] text-base-content/50" x-text="'共 ' + formatGB(stats.mem_total_mb) + ' GB'"></div>
                            <div class="text-[10px] text-base-content/50" x-text="'(' + (stats.mem_percent || 0).toFixed(2) + '%)'"></div>
                        </div>
                    </div>
                </div>

                <!-- 运行时长 -->
                <div class="card card-bordered bg-base-100 shadow-sm">
                    <div class="card-body p-4 flex flex-row items-center gap-3">
                        <div class="p-3 rounded-full bg-accent/10 text-accent shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        </div>
                        <div class="flex-1">
                            <div class="text-xs text-base-content/60" x-text="'运行时长'"></div>
                            <div class="text-2xl font-bold" x-text="formatUptime(stats.uptime_sec)"></div>
                        </div>
                        <button class="btn btn-ghost btn-xs" @click="fetchStats()">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        </button>
                    </div>
                </div>
            </div>
            <template x-for="(items, section) in serverSections" :key="section">
                <!-- 这里的 items 是当前分组下的所有配置项 -->
                <div tabindex="0" class="collapse collapse-arrow border border-base-200 bg-base-100 rounded-box shadow-sm">
                    <input type="checkbox" checked /> 
                    <div class="collapse-title text-base font-bold flex items-center gap-2">
                        <span class="w-1 h-6 bg-primary rounded-full"></span>
                        <span x-text="section"></span>
                    </div>
                    <div class="collapse-content pt-2">
                        <!-- 模组字段由独立的“模组与工坊”页面维护。 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            <template x-for="item in items.filter(i => i.key !== 'Mods' && i.key !== 'WorkshopItems')" :key="item.key">
                                <div class="card card-bordered bg-base-100 shadow-sm hover:shadow-md transition-shadow">
                                    <div class="card-body p-3 gap-1">
                                        <div class="flex items-center gap-2">
                                            <span
                                                class="badge badge-primary badge-outline badge-sm config-key-label shrink-0 font-mono"
                                                :class="item.tooltip ? 'has-tooltip' : ''"
                                                :tabindex="item.tooltip ? 0 : -1"
                                                :aria-label="item.tooltip ? item.key + ': ' + item.tooltip : item.key"
                                                @mouseenter="showConfigTooltip($event, item)"
                                                @mouseleave="hideConfigTooltip()"
                                                @focus="showConfigTooltip($event, item)"
                                                @blur="hideConfigTooltip()"
                                                @keydown.escape="hideConfigTooltip()"
                                                x-text="item.key"
                                            ></span>
                                        </div>
                                        <label class="label py-0">
                                            <span class="label-text text-sm text-base-content/80 select-text" x-text="item.label"></span>
                                        </label>
                                        <template x-if="item.options">
                                            <select class="select select-bordered select-sm w-full mt-1" x-model="item.value">
                                                <template x-for="opt in item.options" :key="opt.value">
                                                    <option :value="opt.value" x-text="opt.label"></option>
                                                </template>
                                            </select>
                                        </template>
                                        <template x-if="!item.options">
                                            <input type="text" class="input input-bordered input-sm w-full mt-1" x-model="item.value" />
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                    </div>
                </div>
            </template>

            <!-- 浮动保存按钮 (Desktop) -->
            <div class="hidden md:flex fixed bottom-8 right-8 gap-3 z-40">
                <button class="btn btn-neutral shadow-lg gap-2" @click="saveConfig('server', false)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M11.25 4.5l7.5 7.5-7.5 7.5m-6-15l7.5 7.5-7.5 7.5" /></svg>
                    <span x-text="i18n.btn_save"></span>
                </button>
                <button class="btn btn-primary shadow-lg gap-2" @click="saveConfig('server', true)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                    <span x-text="i18n.btn_save_restart"></span>
                </button>
            </div>
             <!-- 移动端保存按钮 (底部固定) -->
             <div class="md:hidden grid grid-cols-2 gap-2 mt-4">
                <button class="btn btn-neutral" @click="saveConfig('server', false)"><span x-text="i18n.btn_save"></span></button>
                <button class="btn btn-primary" @click="saveConfig('server', true)"><span x-text="i18n.btn_save_restart"></span></button>
            </div>
        </div>
{{end}}
