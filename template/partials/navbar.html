{{define "partials/navbar"}}
    <!-- 顶部导航 (Desktop & Mobile) -->
    <div class="navbar bg-base-100 shadow-xl z-20 sticky top-0 md:rounded-b-box md:mx-auto md:max-w-7xl md:mt-4">
        <!-- 左侧：图标 + 状态 -->
        <div class="flex-1">
            <a class="btn btn-ghost gap-2 px-2">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6 text-primary">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 0 1-3-3m3 3a3 3 0 1 0 0 6h13.5a3 3 0 1 0 0-6m-16.5-3a3 3 0 0 1 3-3h13.5a3 3 0 0 1 3 3m-19.5 0a4.5 4.5 0 0 1 .9-2.25l.075-.113a4.5 4.5 0 0 1 6.3 6.3l-.075.113m0 0a4.5 4.5 0 0 1-.9 2.25" />
                </svg>
            </a>
        </div>

        <!-- 中间：资源仪表盘 -->
        <div class="flex-1 flex justify-center items-center gap-3">
            <!-- CPU -->
            <div class="flex items-center gap-1.5">
                <span class="badge badge-ghost badge-sm gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
                    <span class="text-xs font-mono" x-text="(stats.cpu_percent ?? 0).toFixed(0) + '%'"></span>
                </span>
                <div class="w-14 h-1.5 rounded-full bg-base-200 overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500" :style="'width:' + Math.min(stats.cpu_percent ?? 0, 100) + '%'" :class="(stats.cpu_percent ?? 0) > 85 ? 'bg-error' : 'bg-primary'"></div>
                </div>
            </div>
            <!-- 内存 -->
            <div class="flex items-center gap-1.5">
                <span class="badge badge-ghost badge-sm gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17.25v1.007a3 3 0 01-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0115 18.257V17.25m6-12V15a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 15V5.25m18 0A2.25 2.25 0 0018.75 3H5.25A2.25 2.25 0 003 5.25m18 0V12a2.25 2.25 0 01-2.25 2.25H5.25A2.25 2.25 0 013 12V5.25" /></svg>
                    <span class="text-xs font-mono" x-text="formatMem(stats.mem_used_mb) + ' / ' + formatMem(stats.mem_total_mb)"></span>
                </span>
                <div class="w-14 h-1.5 rounded-full bg-base-200 overflow-hidden">
                    <div class="h-full rounded-full transition-all duration-500" :style="'width:' + Math.min(stats.mem_percent ?? 0, 100) + '%'" :class="(stats.mem_percent ?? 0) > 85 ? 'bg-error' : 'bg-accent'"></div>
                </div>
            </div>
        </div>

        <!-- 右侧：状态 + 主题 + 语言 -->
        <div class="flex-1 flex justify-end items-center gap-2">
            <div class="badge badge-accent badge-outline text-xs hidden sm:inline-flex"><span x-text="i18n.status_running"></span></div>
            <button class="btn btn-ghost btn-sm gap-1" @click="toggleTheme()" :title="theme === 'dark' ? '切换日间模式' : '切换夜间模式'">
                <!-- 夜间模式(暗)图标：月亮 -->
                <svg x-show="theme === 'dark'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" /></svg>
                <!-- 日间模式(亮)图标：太阳 -->
                <svg x-show="theme === 'light'" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" /></svg>
            </button>
            <select class="select select-bordered select-sm w-24" x-model="lang" @change="switchLanguage()">
                <template x-for="opt in languageList" :key="opt.code">
                    <option :value="opt.code" x-text="opt.name"></option>
                </template>
            </select>
        </div>
    </div>
{{end}}
